<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soundsible social card</title>
<!--
  The repository's social card, rendered at 1280×640 by card.spec.ts from the
  screenshots screens.spec.ts has just taken. It is read at a fraction of that
  size — a link preview, a feed — so everything on it is large and there is
  little of it.
-->
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-weight: 500;
    src: url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-500-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-weight: 800;
    src: url('../node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');
  }
  :root {
    --bg: #0c0c0e;
    --ink: #f2f2f5;
    --ink-soft: #b4b4bc;
    --accent: #f97a12;
    --glow: rgba(249, 122, 18, 0.24);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(640px 420px at 82% -8%, var(--glow), transparent 70%),
      radial-gradient(520px 360px at 6% 104%, rgba(249, 122, 18, 0.10), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .copy {
    position: absolute;
    left: 64px;
    top: 56px;
    width: 560px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .brand img {
    width: 84px;
    height: 84px;
    filter: drop-shadow(0 8px 24px var(--glow));
  }
  h1 {
    margin-top: 44px;
    font-size: 84px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.035em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  p {
    margin-top: 32px;
    color: var(--ink-soft);
    font-size: 30px;
    font-weight: 500;
    line-height: 1.3;
  }
  /* The desktop window from its stage onwards: the library pane would sit
     under the headline and say nothing at this size. */
  .desktop {
    position: absolute;
    left: 640px;
    top: 64px;
    width: 700px;
    height: 640px;
    overflow: hidden;
    border-radius: 20px 0 0 0;
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .desktop img {
    display: block;
    width: 1180px;
    margin-left: -440px;
  }
  .phone {
    position: absolute;
    left: 960px;
    top: 112px;
    width: 312px;
    padding: 9px;
    border-radius: 46px;
    background: #1b1b20;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), -20px 0 60px rgba(0, 0, 0, 0.45);
  }
  .phone img { display: block; width: 100%; border-radius: 37px; }
</style>
</head>
<body>
  <section class="copy">
    <div class="brand"><img src="../../branding/logo-app.png" alt="">Soundsible</div>
    <h1>Your server.<br>Your music.<br>Your <em>DJ</em>.</h1>
    <p>Self-hosted music streaming, with a DJ that mixes your library.</p>
  </section>
  <div class="desktop"><img src="../../docs/images/screenshots/dark/desktop-now-playing.webp" alt=""></div>
  <div class="phone"><img src="../../docs/images/screenshots/dark/mobile-now-playing.webp" alt=""></div>
</body>
</html>
