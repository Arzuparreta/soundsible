<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update WebView — Soundsible</title>
  <style>
    html { color-scheme: dark light; background: #0c0c0e; color: #efeff2; font: 18px/1.5 system-ui, sans-serif; }
    body { margin: 0; padding: 32px 24px; }
    main { max-width: 36em; margin: 8vh auto; }
    h1 { font-size: 1.6em; line-height: 1.2; }
    a { display: block; margin: 16px 0; padding: 14px 18px; border: 1px solid currentColor; border-radius: 12px; color: inherit; }
    a:focus { outline: 3px solid #ff9c3a; outline-offset: 3px; }
    @media (prefers-color-scheme: light) { html { background: #fff; color: #17171c; } }
  </style>
</head>
<body>
  <main>
    <h1>Update Android System WebView</h1>
    <p>Soundsible requires Android 8 or later and WebView 120 or later.</p>
    <p>Update Android System WebView, or Chrome if your device uses Chrome as its WebView provider. Then close and reopen Soundsible.</p>
    <a href="https://play.google.com/store/apps/details?id=com.google.android.webview" target="_blank" rel="noopener">Android System WebView in Google Play</a>
    <a href="https://play.google.com/store/apps/details?id=com.android.chrome" target="_blank" rel="noopener">Chrome in Google Play</a>
  </main>
</body>
</html>
