<!doctype html>
<html lang="en" data-theme="dark" data-booting>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <!-- Installable web app. The manifest gives Android/desktop Chrome a real
         install (and a clean start_url, so a saved icon never carries a used
         invite token). The apple-* metas give iOS the same full-screen launch. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soundsible" />
    <title>Soundsible</title>
    <!-- Applies the stored theme before paint (incl. system → prefers-color-scheme).
         Injected by the boot plugin from src/boot/theme.js, so the palette it
         stamps is the same table the running app uses. -->
    <!-- soundsible:boot-theme -->
    <!-- soundsible:boot-head -->
  </head>
  <body>
    <!-- soundsible:boot-screen -->
    <div id="app" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
