name: Feature request
description: Something Soundsible should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [the roadmap](https://github.com/Arzuparreta/soundsible/blob/main/docs/ROADMAP.md)
        first — it may already be planned, or deliberately out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >-
        Describe the situation, not the solution. "I have 400 albums and no way
        to browse them" tells more than "add an album grid".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: >-
        Workarounds, or how another player handles it. Naming one is useful.
