name: Release

# One tag, one release. `v0.2.0` publishes the container images (through the
# CI workflow, which also triggers on the tag) and the desktop installers, and
# turns them into a single GitHub Release. Before this, engine tags published
# images and no release page, desktop tags published draft releases nobody
# ever pressed publish on, and the two lines used different numbers.
#
# `workflow_dispatch` is how `release-tag.yml` starts it: that workflow tags the
# merged version bump with `GITHUB_TOKEN`, whose pushes start nothing. A
# dispatch on anything but the matching tag fails `verify`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ninety minutes of Windows and Linux builds are not worth spending on a tag
  # that contradicts the tree it points at. CI checks this too; here it is a
  # precondition rather than a report.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag matches the declared version
        run: |
          declared="$(python scripts/version_sync.py --print)"
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME was pushed, but the tree declares $declared."
            exit 1
          fi
          python scripts/version_sync.py --check

  installers:
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop-build.yml

  # The signed Android alpha. It builds, installs over the previous published
  # APK on an emulator, and waits for this commit's own CI before handing the
  # APK over, so it is the slowest job here. Its signing secrets live in the
  # `android-release` environment, which admits main and `v*` tags only.
  android:
    needs: verify
    permissions:
      contents: read
      checks: read
      actions: write
    uses: ./.github/workflows/android-release.yml
    secrets: inherit

  # The iPhone app is not on the App Store — guideline 5.2.3 forbids downloading
  # media from YouTube — so a release *is* its distribution channel. The IPA and
  # the AltStore source that points at it ship with every tag.
  ios:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ios-build.yml

  altstore_source:
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundsible-ios-ipa
          path: ios-artifact

      # `releases/latest/download/apps.json` is a stable URL that always points
      # at the newest release, which is exactly what an AltStore source has to
      # be. Publishing it here rather than in the website repo keeps one number
      # in one place.
      - name: Build the AltStore source
        run: |
          set -euo pipefail
          python3 scripts/altstore_source.py \
            --ipa ios-artifact/Soundsible.ipa \
            --version "${GITHUB_REF_NAME#v}" \
            --out apps.json
          cat apps.json

      - uses: actions/upload-artifact@v4
        with:
          name: soundsible-altstore-source
          path: apps.json
          if-no-files-found: error

  publish:
    needs: [installers, altstore_source, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only what is meant to be downloaded. The builds also pass each other
      # tauri-driver and UI evidence, and `files: artifacts/**` would attach
      # anything that landed here to the release.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: soundsible-*
          merge-multiple: true

      # Image tags carry no `v`; the git tag does. Quoting the wrong one in
      # the install instructions gives a pull command that cannot resolve.
      # Image names must be lowercase, and the repository owner is not:
      # `docker pull ghcr.io/Arzuparreta/...` is rejected as an invalid
      # reference. CI publishes the image under the lowercased name.
      - name: Strip the tag prefix
        id: image
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # `-rc` in the tag is the only thing that marks a release as a
      # pre-release, so the channel is visible in the number itself and cannot
      # be set to one thing and named another.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Soundsible ${{ github.ref_name }}
          files: artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            ## Install

            **Native — the primary installation method.** Run the engine
            directly on Linux, macOS or Windows:

            ```
            git clone --branch ${{ github.ref_name }} https://github.com/${{ github.repository }}.git
            cd soundsible
            cd ui_web && npm ci && cd ..
            python3 run.py
            ```

            Prerequisites and per-OS steps: [Install & Deployment](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md).
            `python3 run.py` opens a terminal menu; on a server, run
            `python3 run.py --daemon` or install it as a
            [systemd service](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md#run-it-as-a-systemd-service).

            **Docker** — supported, and the practical option on a NAS or a
            Raspberry Pi:

            ```
            docker pull ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ```

            **Desktop app (beta)** — one machine, no terminal. Attached below:
            the Windows installers; `.deb` for Debian, Ubuntu and Mint; `.rpm`
            for Fedora; and a `.flatpak` for any distribution
            (`flatpak install Soundsible_*.flatpak`).

            **Android (alpha)** — `Soundsible-Android-alpha.apk` is attached;
            check it against `SHA256SUMS-android.txt`. Install it over an
            earlier alpha to keep your account and offline copies:
            [Android alpha](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/android/ALPHA.md).
            `upgrade-seed-androidTest.apk` is test evidence, not an app.

            **iPhone and iPad** — `Soundsible.ipa` is attached. Soundsible is
            not on the App Store, so it installs through
            [SideStore](https://sidestore.io) or AltStore. Add this source:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/apps.json
            ```

            Pairing, offline downloads and what works in the car:
            [iOS](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/IOS.md).

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The landing site reads `releases/latest` at build time, and nothing used to
  # tell it a new one existed: it only rebuilt on its own daily schedule, so a
  # release cut just after that build went unannounced until the next one.
  # v0.8.1 landed 68 minutes late to that party and the site said 0.8.0 for a
  # day. This is the missing edge, and it is its own job so a failed ping is
  # legible as "the site was not refreshed" rather than as a failed release —
  # by this point the release itself is published and cannot be undone.
  refresh_site:
    needs: publish
    # A pre-release is not documentation: `sync-docs.mjs` refuses one outright,
    # so asking for a build of an `-rc.` tag would only turn the site's red.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Running the site's own workflow, rather than sending it a
      # `repository_dispatch`, is the narrower of the two doors: this needs a
      # token with Actions: write, while a dispatch needs Contents: write —
      # push access to the site's source, to ask it to rebuild. It also needs
      # nothing added on the far side, since `deploy.yml` already takes a
      # `source_tag`, which pins the build to the release that triggered it
      # instead of re-asking for "latest" and possibly getting a newer answer.
      #
      # `GITHUB_TOKEN` cannot start a workflow in another repository at all,
      # hence the PAT.
      - name: Ask the landing site to rebuild
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # No token is the normal state, not a broken one: creating a PAT is
          # a manual act nobody has had to perform yet, and the site's own
          # hourly schedule already keeps it within an hour of the truth. Say
          # so and stop, rather than painting a finished release red. The day
          # a token appears this starts working with no further change.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is unset, so the site was not told about $GITHUB_REF_NAME directly. Its hourly build will pick it up within the hour."
            exit 0
          fi
          gh workflow run deploy.yml \
            --repo "${{ github.repository_owner }}/soundsible.github.io" \
            -f source_tag="$GITHUB_REF_NAME"

  # The AUR holds a recipe, not binaries: a PKGBUILD that downloads the .deb
  # attached above and repackages it, which is what `yay -S soundsible-bin`
  # builds. Each release points it at the new .deb.
  aur:
    needs: publish
    # Arch has no notion of a pre-release; publishing one would move every
    # AUR user onto it.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install makepkg and git
        run: pacman -Syu --noconfirm --needed base-devel git openssh python

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: soundsible-desktop-linux-*
          path: packages
          merge-multiple: true

      - name: Publish soundsible-bin
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Like SITE_DISPATCH_TOKEN: no key is the state before anyone has
          # registered the package, not a broken release.
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY is unset, so soundsible-bin was not updated to $GITHUB_REF_NAME. docs/LINUX_PACKAGES.md says how to set it up."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pinned rather than scanned, so a spoofed host cannot take the key.
          # SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as published
          # on aur.archlinux.org.
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          useradd -m builder
          work=$(runuser -u builder -- mktemp -d)
          chown builder "$work"
          git clone ssh://aur@aur.archlinux.org/soundsible-bin.git "$work/aur"
          python3 scripts/linux_packages.py aur --deb packages/deb/Soundsible_*_amd64.deb --out "$work/aur"
          chown -R builder "$work"
          (cd "$work/aur" && runuser -u builder -- makepkg --printsrcinfo > .SRCINFO)

          cd "$work/aur"
          # makepkg needed the checkout to belong to builder; git runs as root.
          git config --global --add safe.directory "$work/aur"
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "soundsible-bin already describes $GITHUB_REF_NAME."
            exit 0
          fi
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin HEAD:master
