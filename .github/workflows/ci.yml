name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  schedule:
    # Rebuild from fresh upstream base images and package indexes. This catches
    # Docker drift even when Soundsible itself has not changed.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  # The required checks (docker, docker_arm64, community_docker) are the slow
  # ones — a full image build plus an emulated arm64 build. Most PRs (UI copy,
  # docs, desktop-shell) touch nothing that ends up in either image, so this
  # gates them to a fast skip instead of a full rebuild. Skipped is still a
  # passing conclusion for required status checks, so it doesn't weaken the
  # merge gate — it only avoids redundant work.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      community: ${{ steps.filter.outputs.community }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'compose.yaml'
              - 'compose.build.yaml'
              - 'requirements.txt'
              - 'requirements.docker.lock'
              - 'shared/**'
              - 'player/**'
              - 'odst_tool/**'
              - 'setup_tool/**'
              - 'ui_web/**'
              - 'run.py'
              - 'soundsible_engine.py'
              - '.github/workflows/ci.yml'
            community:
              - 'community_service/**'
              - 'deploy/community/**'
              - '.github/workflows/ci.yml'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools
          pip install -r requirements.txt
      # One run, one signal. `--cov=.` used to include tests/ itself — ~12.5k
      # lines that are covered by construction — which inflated the total enough
      # that the 30% floor could not fail. Scoped to the source packages the
      # real number is ~55%, so that is the ratchet.
      - name: Phase 1 gates (pytest + coverage)
        env:
          PYTHONPATH: .
          # Leave the version to shared/version.py, so the suite checks what the
          # source tree declares rather than whatever the runner exported.
          SOUNDSIBLE_VERSION: ""
        run: >-
          pytest -q
          --cov=shared --cov=player --cov=odst_tool --cov=setup_tool
          --cov-report=term-missing --cov-fail-under=55

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .

  # shared/version.py is the declaration; the desktop manifests are copies,
  # because Cargo, npm and Tauri cannot read Python. Copies drift, and drift
  # here is invisible until an installer reports a version that was never
  # released. This is the job that makes the copies trustworthy.
  version_consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manifests agree with the declaration
        run: python scripts/version_sync.py --check
      # A tag is a promise about what the source tree said at that commit.
      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared="$(python scripts/version_sync.py --print)"
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME was pushed, but the tree declares $declared."
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches the declaration."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bandit security scan
        run: bandit -r . -f txt -o bandit-report.txt || true
      - name: Show bandit report
        run: cat bandit-report.txt

  ui_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      # Without this the ~58 vitest files were advisory only: a regression in
      # the store or the playback contract merged green.
      - name: Unit tests (vitest)
        run: npm run test:unit
      - name: Build player bundle (vite + tailwind)
        run: npm run build

  docker:
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: soundsible-ci
      SOUNDSIBLE_PORT: 15005
      COMPOSE_BAKE: "true"
      # compose.yaml alone pulls the published image. Stacking the build
      # override makes every `docker compose` call below exercise this commit.
      COMPOSE_FILE: compose.yaml:compose.build.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependency-lock verifier
        run: python -m pip install --disable-pip-version-check --no-deps packaging==26.2
      - name: Verify the Docker dependency lock matches its source requirements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          from packaging.requirements import Requirement

          locked = {}
          for line in Path("requirements.docker.lock").read_text(encoding="utf-8").splitlines():
              if "==" not in line or line.startswith((" ", "#")):
                  continue
              name, version = line.split("==", 1)
              locked[name.lower().replace("_", "-").replace(".", "-")] = version.split()[0].rstrip("\\")
          requirements = []
          for raw in Path("requirements.txt").read_text(encoding="utf-8").splitlines():
              candidate = raw.split("#", 1)[0].strip()
              if candidate:
                  requirements.append(Requirement(candidate))

          mismatches = []
          for requirement in requirements:
              name = requirement.name.lower().replace("_", "-").replace(".", "-")
              version = locked.get(name)
              if version is None:
                  mismatches.append(f"{requirement.name}: missing from requirements.docker.lock")
              elif requirement.specifier and not requirement.specifier.contains(version, prereleases=True):
                  mismatches.append(f"{requirement.name}: lock has {version}, expected {requirement.specifier}")
          if mismatches:
              raise SystemExit("Docker lock is stale:\n" + "\n".join(mismatches))
          PY
      - name: Validate Compose contract
        run: docker compose config --quiet
      - name: Build production image
        if: github.event_name != 'schedule'
        run: docker compose build --pull
      - name: Rebuild nightly without cache
        if: github.event_name == 'schedule'
        run: docker compose build --pull --no-cache
      - name: Smoke test the supported Compose deployment
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color || true
            docker compose down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose up --detach --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:15005/api/health | grep '"status":"healthy"'
          curl --fail --silent --output /dev/null http://127.0.0.1:15005/player/
          test "$(docker compose exec --no-TTY soundsible id --user)" = "1000"
          config_digest=$(docker compose exec --no-TTY soundsible sha256sum /config/config.json | cut --delimiter=' ' --fields=1)
          docker compose up --detach --force-recreate --wait --wait-timeout 120
          test "$config_digest" = "$(docker compose exec --no-TTY soundsible sha256sum /config/config.json | cut --delimiter=' ' --fields=1)"

  community_docker:
    needs: changes
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.community == 'true'
    runs-on: ubuntu-latest
    env:
      COMMUNITY_TURN_SECRET: ci-turn-secret
      COMMUNITY_SECRET_KEY: ci-community-secret
      COMMUNITY_PUBLIC_URL: https://community.example.test
      COMMUNITY_MEDIA_URL: https://community.example.test/media
    steps:
      - uses: actions/checkout@v4
      - name: Validate Community Compose contract
        run: docker compose --env-file /dev/null -f deploy/community/docker-compose.yml config --quiet
      - name: Build Community API image
        run: docker build --pull ${{ github.event_name == 'schedule' && '--no-cache' || '' }} --tag soundsible-community:ci --file community_service/Dockerfile .
      - name: Smoke test Community API image
        shell: bash
        run: |
          set -euo pipefail
          docker network create soundsible-community-ci
          docker run --detach --name soundsible-mediamtx-stub-ci \
            --network soundsible-community-ci \
            --network-alias mediamtx \
            python:3.13-slim \
            python -c 'from http.server import BaseHTTPRequestHandler, HTTPServer; Handler = type("Handler", (BaseHTTPRequestHandler,), {"do_GET": lambda self: (self.send_response(200), self.end_headers()), "log_message": lambda *args: None}); HTTPServer(("", 9997), Handler).serve_forever()'
          cleanup() {
            docker logs soundsible-community-ci || true
            docker rm --force soundsible-community-ci soundsible-mediamtx-stub-ci || true
            docker network rm soundsible-community-ci || true
          }
          trap cleanup EXIT
          docker run --detach --name soundsible-community-ci \
            --publish 127.0.0.1:18080:8080 \
            --network soundsible-community-ci \
            --env COMMUNITY_PUBLIC_URL \
            --env COMMUNITY_MEDIA_URL \
            --env COMMUNITY_SECRET_KEY \
            --env COMMUNITY_MEDIA_HEALTH_URL=http://mediamtx:9997 \
            soundsible-community:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health | grep '"status":"healthy"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  docker_arm64:
    needs: [changes, docker]
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the production image for Apple Silicon and ARM servers
        run: >-
          docker buildx build --platform linux/arm64
          ${{ github.event_name == 'schedule' && '--no-cache' || '--cache-from type=gha,scope=docker-arm64 --cache-to type=gha,mode=max,scope=docker-arm64' }}
          --pull --target runtime --provenance=false --output type=cacheonly .

  ui_accessibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Validate interface scaling
        run: npm run test:ui-scale
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-accessibility-report
          path: ui_web/playwright-report
          retention-days: 14

  # Everything above proves the image works. This is what makes it reachable.
  # Until this job existed the only way to install Soundsible was to clone the
  # repo and build it, which rules out exactly the hardware — NAS boxes, Pis —
  # where a self-hosted music server belongs.
  #
  # main pushes publish `edge`; a `v*` tag publishes the semver tags and moves
  # `latest`. The docker jobs are allowed to be *skipped* (paths-filter decided
  # nothing in the image changed) but never allowed to have failed.
  publish:
    needs: [tests, lint, ui_build, version_consistency, docker, docker_arm64]
    if: >-
      !cancelled()
      && needs.tests.result == 'success'
      && needs.lint.result == 'success'
      && needs.ui_build.result == 'success'
      && needs.version_consistency.result == 'success'
      && needs.docker.result != 'failure'
      && needs.docker_arm64.result != 'failure'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc.') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Soundsible
            org.opencontainers.image.licenses=MIT
      # A tagged build reports its tag. A main build reports edge plus the sha,
      # so two `edge` images are never indistinguishable from each other.
      - name: Resolve the version the image reports about itself
        id: version
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-edge+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOUNDSIBLE_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=docker-arm64
            type=gha,scope=docker-publish
          cache-to: type=gha,mode=max,scope=docker-publish
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
