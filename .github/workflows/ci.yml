name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools
          pip install -r requirements.txt
      # One run, one signal. `--cov=.` used to include tests/ itself — ~12.5k
      # lines that are covered by construction — which inflated the total enough
      # that the 30% floor could not fail. Scoped to the source packages the
      # real number is ~55%, so that is the ratchet.
      - name: Phase 1 gates (pytest + coverage)
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          --cov=shared --cov=player --cov=odst_tool --cov=setup_tool
          --cov-report=term-missing --cov-fail-under=55

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff check
        run: ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bandit security scan
        run: bandit -r . -f txt -o bandit-report.txt || true
      - name: Show bandit report
        run: cat bandit-report.txt

  ui_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      # Without this the ~58 vitest files were advisory only: a regression in
      # the store or the playback contract merged green.
      - name: Unit tests (vitest)
        run: npm run test:unit
      - name: Build player bundle (vite + tailwind)
        run: npm run build

  ui_accessibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - name: Install JS dependencies
        run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Validate interface scaling
        run: npm run test:ui-scale
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-accessibility-report
          path: ui_web/playwright-report
          retention-days: 14
