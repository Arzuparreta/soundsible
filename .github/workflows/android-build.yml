name: Android development

# Development artifacts only. No release/tag/upload-to-store action belongs here.
on:
  push:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'ui_web/**'
      - 'branding/**'
      # Every Android script: the fixtures the emulator suite starts are
      # as much a part of it as the tests (the Live relay's was missing).
      - 'scripts/android*'
      - 'docs/android/CAPABILITIES.json'
      - 'docs/android/SIGNING.json'
      - '.github/workflows/android-release.yml'
      - 'scripts/download_retry.py'
      - 'scripts/ci_retry.sh'
      - 'shared/**'
      - 'requirements.txt'
      - 'scripts/version_sync.py'
      - 'shared/version.py'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'ui_web/**'
      - 'branding/**'
      # Every Android script: the fixtures the emulator suite starts are
      # as much a part of it as the tests (the Live relay's was missing).
      - 'scripts/android*'
      - 'docs/android/CAPABILITIES.json'
      - 'docs/android/SIGNING.json'
      - '.github/workflows/android-release.yml'
      - 'scripts/download_retry.py'
      - 'scripts/ci_retry.sh'
      - 'shared/**'
      - 'requirements.txt'
      - 'scripts/version_sync.py'
      - 'shared/version.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no emulator, and the distributable development APK.
  static:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOUNDSIBLE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
      # A flaky registry costs a retry, not the run.
      NPM_CONFIG_FETCH_RETRIES: '5'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The retired SDK tools package is still an action default.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and JS dependencies
        run: |
          scripts/ci_retry.sh -- sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          scripts/ci_retry.sh -- npm ci --prefix ui_web
          scripts/ci_retry.sh -- python -m pip install -r requirements.txt
      - name: Cache pinned WebRTC dependency
        uses: actions/cache@v4
        with:
          # Checksum-verified on every use; the key changes with the pin.
          path: android/build/webrtc-original.aar
          key: android-webrtc-${{ hashFiles('scripts/android_webrtc.py') }}
      - name: Validate TypeScript and shared player tests
        run: npm test --prefix ui_web
      - name: Build development APK and instrumentation APK
        run: python scripts/android.py build
      - name: Native retry unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload development APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundsible-android-development-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/
            android/build-info.json

  # The instrumented suite is split across emulators that run in parallel:
  # one emulator ran every case in series and took most of an hour. Slices are
  # independent (each case resets its own fixture state) and every runner owns
  # its three disposable engines. Shard 0 also owns the offline smoke run and
  # the process-restart protocols, which are single, ordered scenarios.
  emulator:
    name: Emulator shard ${{ matrix.shard }}/4 (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SOUNDSIBLE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
      # A flaky registry costs a retry, not the run.
      NPM_CONFIG_FETCH_RETRIES: '5'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native audio fixture dependencies
        run: |
          scripts/ci_retry.sh -- sudo apt-get -o Acquire::Retries=5 update
          scripts/ci_retry.sh -- sudo apt-get -o Acquire::Retries=5 install -y ffmpeg
      - name: Install SDK and JS dependencies
        run: |
          scripts/ci_retry.sh -- sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          scripts/ci_retry.sh -- npm ci --prefix ui_web
          scripts/ci_retry.sh -- python -m pip install -r requirements.txt
      - name: Cache pinned WebRTC dependency
        uses: actions/cache@v4
        with:
          # Checksum-verified on every use; the key changes with the pin.
          path: android/build/webrtc-original.aar
          key: android-webrtc-${{ hashFiles('scripts/android_webrtc.py') }}
      - name: Prepare web bundle
        run: python scripts/android.py prepare
      - name: Install emulator and system image
        # The emulator runner downloads these itself, once, and a cut-off zip
        # ("Error on ZipFile unknown archive") failed whole shards. Installed
        # here with retries, the runner finds them in place.
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          scripts/ci_retry.sh --cleanup "rm -rf '$sdk/system-images/android-36/google_apis/x86_64' '$sdk/emulator' '$sdk/.temp' ~/.android/cache" \
            -- sdkmanager --install emulator 'system-images;android-36;google_apis;x86_64' --channel=0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Packaged offline playback, process restart and real account integration (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            scripts/android_ci_shard.sh ${{ matrix.shard }} 4
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundsible-android-emulator-${{ matrix.shard }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/androidTest-results/
            android/build/startup.png
            android/build/library.png
            android/build/program.png
            android/build/integration-results/
            android/build/emulator.log
            android/build/fixture.log
