name: Android development

# Development artifacts only. No release/tag/upload-to-store action belongs here.
on:
  push:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'ui_web/**'
      - 'branding/**'
      - 'scripts/android.py'
      - 'scripts/android_fixture.py'
      - 'scripts/android_preview_fixture.py'
      - 'scripts/android_catalog_fixture.py'
      - 'scripts/android_podcast_fixture.py'
      - 'scripts/android_radio_fixture.py'
      - 'scripts/android_test_tls.py'
      - 'shared/**'
      - 'requirements.txt'
      - 'scripts/version_sync.py'
      - 'shared/version.py'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'android/**'
      - 'ui_web/**'
      - 'branding/**'
      - 'scripts/android.py'
      - 'scripts/android_fixture.py'
      - 'scripts/android_preview_fixture.py'
      - 'scripts/android_catalog_fixture.py'
      - 'scripts/android_podcast_fixture.py'
      - 'scripts/android_radio_fixture.py'
      - 'scripts/android_test_tls.py'
      - 'shared/**'
      - 'requirements.txt'
      - 'scripts/version_sync.py'
      - 'shared/version.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOUNDSIBLE_ANDROID_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and JS dependencies
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          npm ci --prefix ui_web
          python -m pip install -r requirements.txt
      - name: Validate TypeScript and shared player tests
        run: npm test --prefix ui_web
      - name: Build development APK and instrumentation APK
        run: python scripts/android.py build
      - name: Native retry unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Packaged offline playback, process restart and real account integration (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            python scripts/android.py smoke
            python scripts/android.py integration
            python scripts/android.py install
            adb exec-out screencap -p > android/build/startup.png
            adb logcat -d > android/build/emulator.log
      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundsible-android-development-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
            android/build-info.json
            android/build/startup.png
            android/build/library.png
            android/build/program.png
            android/build/integration-results/
            android/build/emulator.log
            android/build/fixture.log
