name: Desktop Release

on:
  push:
    branches: [main, dev]
    tags:
      - "desktop-v*"
    paths: &desktop-paths
      - 'desktop-shell/**'
      - 'shared/**'
      - 'soundsible_engine.py'
      - 'run.py'
      - 'tests/test_desktop_engine_smoke.py'
      - 'tests/test_desktop_bootstrap.py'
      - 'tests/test_desktop_engine_entry.py'
      - 'requirements.txt'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    branches: [main, dev]
    paths: *desktop-paths
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev libssl-dev patchelf build-essential curl unzip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build sidecar and FFmpeg
        env:
          BUNDLE_FFMPEG: "1"
        run: ./desktop-shell/scripts/build-sidecar.sh

      - name: Build Tauri bundles
        working-directory: desktop-shell
        env:
          SOUNDSIBLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          # AppImage/RPM are slow and often look hung on CI; keep Linux delivery to .deb.
          npm run tauri build -- --bundles deb

      # actions/upload-artifact@v4 rejects '/' in artifact names. On
      # pull_request events github.ref_name is "<PR>/merge" (e.g. "22/merge"),
      # so sanitise the ref into a slash-free suffix.
      - name: Compute artifact name
        shell: bash
        run: echo "ARTIFACT_NAME=soundsible-desktop-linux-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            desktop-shell/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: build-windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Provision OpenSSL for Python cryptography (Windows ARM64)
        if: matrix.arch == 'arm64'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151
        with:
          repo: pyca/infra
          workflow: build-windows-openssl.yml
          branch: main
          workflow_conclusion: success
          name: openssl-arm64
          path: C:/openssl-arm64
          github_token: ${{ github.token }}

      - name: Configure OpenSSL for Python cryptography (Windows ARM64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          echo "OPENSSL_DIR=C:/openssl-arm64" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate ARM64 cryptography runtime
        if: matrix.arch == 'arm64'
        run: python -c "from cryptography.hazmat.bindings._rust import openssl"

      - name: Build sidecar and FFmpeg
        shell: bash
        env:
          BUNDLE_FFMPEG: "1"
        run: ./desktop-shell/scripts/build-sidecar.sh

      - name: Build Tauri bundles
        working-directory: desktop-shell
        env:
          SOUNDSIBLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          npm run build

      - name: Verify native binary architectures
        shell: pwsh
        run: |
          ./desktop-shell/scripts/verify-pe-architecture.ps1 `
            -Architecture "${{ matrix.arch }}" `
            "desktop-shell/src-tauri/binaries/soundsible-engine-${{ matrix.target }}.exe" `
            "desktop-shell/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe" `
            "desktop-shell/src-tauri/target/release/soundsible-desktop.exe"

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $bundle = "desktop-shell/src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$bundle/*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ASCII "$bundle/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Attest Windows installer
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop-shell/src-tauri/target/release/bundle/nsis/*.exe

      - name: Compute artifact name
        shell: bash
        run: echo "ARTIFACT_NAME=soundsible-desktop-windows-${{ matrix.arch }}-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            desktop-shell/src-tauri/target/release/bundle/nsis/*.exe
            desktop-shell/src-tauri/target/release/bundle/nsis/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
