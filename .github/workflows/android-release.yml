name: Android alpha release

# The signed APK is part of every version: release.yml calls this on the `v*`
# tag and attaches what it stages beside the other platforms. Until 0.21.1 it
# went out separately, as an `android-alpha/*` prerelease of its own.
#
# Run by hand on main it is a dry run: the same build, verification and
# acceptance, ending in an artifact that is attached to nothing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # About 45 minutes of build and acceptance, plus up to 90 waiting for the
    # tagged commit's CI in the staging step.
    timeout-minutes: 150
    environment: android-release
    permissions:
      contents: read
      checks: read
      # To dispatch Android development for the commit being released.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOUNDSIBLE_ANDROID_TEST_RELEASE: '1'
      NPM_CONFIG_FETCH_RETRIES: '5'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build and fixture dependencies
        run: |
          scripts/ci_retry.sh -- sudo apt-get -o Acquire::Retries=5 update
          scripts/ci_retry.sh -- sudo apt-get -o Acquire::Retries=5 install -y ffmpeg
          scripts/ci_retry.sh -- sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          scripts/ci_retry.sh -- npm ci --prefix ui_web
          scripts/ci_retry.sh -- python -m pip install -r requirements.txt
      - name: Verify gates and plan the build
        run: python scripts/android_release.py plan
      # Runs beside this job; `stage` waits for it at the end.
      - name: Request this commit's Android checks
        run: python scripts/android_release.py android-checks
      - name: Restore permanent signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'android-signing'
          root.mkdir(mode=0o700)
          key, password = root / 'release.p12', root / 'password'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'], validate=True))
          password.write_text(os.environ['SIGNING_PASSWORD'])
          key.chmod(0o600)
          password.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'ANDROID_KEYSTORE={key}\nANDROID_KEYSTORE_PASSWORD_FILE={password}\n')
          PY
      - name: Compile and verify signed release APK
        run: |
          python scripts/android_release.py build
          python scripts/android_release.py verify
      - name: Install emulator and system image
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          scripts/ci_retry.sh --cleanup "rm -rf '$sdk/system-images/android-36/google_apis/x86_64' '$sdk/emulator' '$sdk/.temp' ~/.android/cache" \
            -- sdkmanager --install emulator 'system-images;android-36;google_apis;x86_64' --channel=0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual release installation, update, offline and App Links
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: python scripts/android_release.py acceptance
      # Waits for the tagged commit's own CI, which runs beside this job.
      - name: Stage the verified APK for the version's release
        run: python scripts/android_release.py stage

      # `soundsible-*` is what release.yml's publish step attaches.
      - name: Upload the staged APK
        uses: actions/upload-artifact@v4
        with:
          name: soundsible-android-alpha-${{ github.ref_name }}
          path: android/build/alpha/release/
          if-no-files-found: error
      - name: Preserve public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-alpha-evidence-${{ github.sha }}
          path: |
            android/build/alpha/*.json
            android/build/alpha/*.txt
            android/build/alpha/app-links-*.xml
            android/app/build/reports/
      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
