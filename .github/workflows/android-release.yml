name: Android alpha release

on:
  workflow_dispatch:

permissions:
  contents: read

# One allocator owns this channel; failed drafts retain their reserved codes.
concurrency:
  group: android-public-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOUNDSIBLE_ANDROID_TEST_RELEASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui_web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build and fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          npm ci --prefix ui_web
          python -m pip install -r requirements.txt
      - name: Verify gates and reserve channel build
        run: python scripts/android_release.py reserve
      - name: Restore permanent signing identity
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'android-signing'
          root.mkdir(mode=0o700)
          key, password = root / 'release.p12', root / 'password'
          key.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'], validate=True))
          password.write_text(os.environ['SIGNING_PASSWORD'])
          key.chmod(0o600)
          password.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'ANDROID_KEYSTORE={key}\nANDROID_KEYSTORE_PASSWORD_FILE={password}\n')
          PY
      - name: Compile and verify signed release APK
        run: |
          python scripts/android_release.py build
          python scripts/android_release.py verify
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual release installation, update, offline and App Links
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: python scripts/android_release.py acceptance
      - name: Publish verified independent Android prerelease
        run: python scripts/android_release.py publish
      - name: Preserve public acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-alpha-evidence-${{ github.sha }}
          path: |
            android/build/alpha/*.json
            android/build/alpha/*.txt
            android/build/alpha/app-links-*.xml
            android/app/build/reports/
      - name: Remove signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
