name: Release tag

# Merging the version-bump pull request is the release. Before this, the merge
# only changed a number in the tree, and nothing appeared under Releases until
# somebody remembered to run `scripts/release.py finish` from a checkout.
#
# A tag pushed with `GITHUB_TOKEN` starts no workflow, so this job pushes the
# tag and then dispatches the two workflows a pushed tag would have started.
# `workflow_dispatch` is the one event a `GITHUB_TOKEN` is allowed to cause.
# If the tag already exists — `release.py finish` got there first — its own
# push already started them, and this does nothing.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event.pull_request.merged
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      # The squash commit the merge created, not whatever main is by the time
      # this runs: another merge seconds later must not be what gets tagged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag the merge commit and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python scripts/version_sync.py --check
          tag="v$(python scripts/version_sync.py --print)"
          if [ "release/$tag" != "$BRANCH" ]; then
            echo "::error::$BRANCH was merged, but the tree declares $tag. Nothing was tagged."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists; its push started the release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" --message "Soundsible ${tag#v}"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
          gh workflow run ci.yml --ref "$tag"
          echo "::notice::$tag → $(git rev-parse --short HEAD); Release and CI dispatched on it."
