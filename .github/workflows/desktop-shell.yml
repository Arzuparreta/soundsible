name: Desktop Shell CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      - 'desktop-shell/**'
      - 'shared/**'
      - 'player/**'
      - 'setup_tool/**'
      - 'ui_web/**'
      - 'soundsible_engine.py'
      - 'run.py'
      - 'tests/test_desktop_engine_smoke.py'
      - 'tests/test_desktop_bootstrap.py'
      - 'tests/test_desktop_engine_entry.py'
      - 'requirements.txt'
      - '.github/workflows/desktop-shell.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'desktop-shell/**'
      - 'shared/**'
      - 'player/**'
      - 'setup_tool/**'
      - 'ui_web/**'
      - 'soundsible_engine.py'
      - 'run.py'
      - 'tests/test_desktop_engine_smoke.py'
      - 'tests/test_desktop_bootstrap.py'
      - 'tests/test_desktop_engine_entry.py'
      - 'requirements.txt'
      - '.github/workflows/desktop-shell.yml'

concurrency:
  group: desktop-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The quick checks of the desktop shell: the engine as dev Python, and the
# shell's own UI. Building the app — sidecar, Tauri bundles, the Windows
# installer and its native UI smoke — is Desktop Build's job; it used to be
# done here as well, twice per pull request and without a Rust cache.
jobs:
  desktop_engine_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Desktop engine smoke (dev Python)
        env:
          PYTHONPATH: .
        run: pytest tests/test_desktop_engine_smoke.py::test_desktop_engine_smoke_python -q

  # Same arrangement as CI's browser jobs: Playwright's own image, at the
  # version this lockfile pins, so Chromium needs no apt-get.
  browser_image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop-shell/package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: |
          version="$(jq -r '.packages["node_modules/@playwright/test"].version // empty' desktop-shell/package-lock.json)"
          test -n "$version"
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  desktop_shell_ui:
    needs: browser_image
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.browser_image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-shell-${{ hashFiles('desktop-shell/package-lock.json') }}
      - name: Install shell dependencies
        working-directory: desktop-shell
        run: npm ci
      - name: Validate shell state and bundle
        working-directory: desktop-shell
        run: |
          npm test
          npm run frontend:build
      - name: Validate shell layout and accessibility
        working-directory: desktop-shell
        run: npm run test:ui
      - name: Upload shell browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell-browser-report
          path: desktop-shell/playwright-report
          if-no-files-found: warn
          retention-days: 14
