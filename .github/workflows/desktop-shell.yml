name: Desktop Shell CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      - 'desktop-shell/**'
      - 'shared/**'
      - 'soundsible_engine.py'
      - 'run.py'
      - 'tests/test_desktop_engine_smoke.py'
      - 'tests/test_desktop_bootstrap.py'
      - 'tests/test_desktop_engine_entry.py'
      - 'requirements.txt'
      - '.github/workflows/desktop-shell.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'desktop-shell/**'
      - 'shared/**'
      - 'soundsible_engine.py'
      - 'run.py'
      - 'tests/test_desktop_engine_smoke.py'
      - 'tests/test_desktop_bootstrap.py'
      - 'tests/test_desktop_engine_entry.py'
      - 'requirements.txt'
      - '.github/workflows/desktop-shell.yml'

jobs:
  desktop_engine_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Desktop engine smoke (dev Python)
        env:
          PYTHONPATH: .
        run: pytest tests/test_desktop_engine_smoke.py::test_desktop_engine_smoke_python -q

  desktop_shell_ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json
      - name: Install shell dependencies
        working-directory: desktop-shell
        run: npm ci
      - name: Validate shell state and bundle
        working-directory: desktop-shell
        run: |
          npm test
          npm run frontend:build
      - name: Install Chromium
        working-directory: desktop-shell
        run: npx playwright install --with-deps chromium
      - name: Validate shell layout and accessibility
        working-directory: desktop-shell
        run: npm run test:ui
      - name: Upload shell browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shell-browser-report
          path: desktop-shell/playwright-report
          if-no-files-found: warn
          retention-days: 14

  desktop_sidecar_and_tauri:
    runs-on: ubuntu-latest
    needs: [desktop_engine_smoke, desktop_shell_ui]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build PyInstaller sidecar
        env:
          BUNDLE_FFMPEG: "1"
        run: ./desktop-shell/scripts/build-sidecar.sh

      - name: Desktop engine smoke (PyInstaller sidecar)
        env:
          PYTHONPATH: .
          SOUNDSIBLE_ENGINE_BIN: desktop-shell/src-tauri/binaries/soundsible-engine-x86_64-unknown-linux-gnu
        run: pytest tests/test_desktop_engine_smoke.py::test_desktop_engine_smoke_sidecar -q

      - name: Build Tauri desktop shell
        working-directory: desktop-shell
        env:
          SOUNDSIBLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          npm run build

  desktop_sidecar_windows:
    name: desktop_windows_${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: [desktop_engine_smoke, desktop_shell_ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Provision OpenSSL for Python cryptography (Windows ARM64)
        if: matrix.arch == 'arm64'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151
        with:
          repo: pyca/infra
          workflow: build-windows-openssl.yml
          branch: main
          workflow_conclusion: success
          name: openssl-arm64
          path: C:/openssl-arm64
          github_token: ${{ github.token }}

      - name: Configure OpenSSL for Python cryptography (Windows ARM64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          echo "OPENSSL_DIR=C:/openssl-arm64" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pywinauto==0.6.9

      - name: Validate ARM64 cryptography runtime
        if: matrix.arch == 'arm64'
        run: python -c "from cryptography.hazmat.bindings._rust import openssl"

      - name: Validate shell modules
        working-directory: desktop-shell
        run: |
          npm ci
          npm test

      - name: Build PyInstaller sidecar (Windows)
        shell: bash
        env:
          BUNDLE_FFMPEG: "1"
        run: ./desktop-shell/scripts/build-sidecar.sh

      - name: Desktop engine smoke (PyInstaller sidecar)
        shell: bash
        env:
          PYTHONPATH: .
          SOUNDSIBLE_ENGINE_BIN: desktop-shell/src-tauri/binaries/soundsible-engine-${{ matrix.target }}.exe
        run: pytest tests/test_desktop_engine_smoke.py::test_desktop_engine_smoke_sidecar -q

      - name: Verify sidecar and FFmpeg architecture
        shell: pwsh
        run: |
          ./desktop-shell/scripts/verify-pe-architecture.ps1 `
            -Architecture "${{ matrix.arch }}" `
            "desktop-shell/src-tauri/binaries/soundsible-engine-${{ matrix.target }}.exe" `
            "desktop-shell/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe"

      - name: Build Tauri desktop shell (Windows)
        working-directory: desktop-shell
        env:
          SOUNDSIBLE_REPO_ROOT: ${{ github.workspace }}
        run: npm run build

      - name: Verify native shell architecture
        shell: pwsh
        run: |
          ./desktop-shell/scripts/verify-pe-architecture.ps1 `
            -Architecture "${{ matrix.arch }}" `
            "desktop-shell/src-tauri/target/release/soundsible-desktop.exe"

      - name: Install, exercise native UI, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "desktop-shell/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          ./desktop-shell/scripts/windows-installer-smoke.ps1 `
            -Installer $installer.FullName `
            -ArtifactDirectory "desktop-shell/windows-smoke-artifacts/${{ matrix.arch }}" `
            -UiSmoke

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundsible-windows-smoke-${{ matrix.arch }}
          path: desktop-shell/windows-smoke-artifacts/${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14
