name: Desktop Build

# Builds the installers and stops there. Releasing them is release.yml's job,
# which calls this workflow on a `v*` tag: one tag produces the images and the
# installers, so a version always exists in every form it can be installed in.
on:
  push:
    branches: [main, dev]
    paths: &desktop-paths
      - 'desktop-shell/**'
      - 'shared/**'
      - 'player/**'
      - 'setup_tool/**'
      - 'ui_web/**'
      - 'soundsible_engine.py'
      - 'run.py'
      - 'tests/test_desktop_engine_smoke.py'
      - 'tests/test_desktop_bootstrap.py'
      - 'tests/test_desktop_engine_entry.py'
      - 'requirements.txt'
      - 'scripts/linux_packages.py'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [main, dev]
    paths: *desktop-paths
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

# A new push to a pull request makes the previous run's installers worthless.
# Called from release.yml on a tag, nothing is ever cancelled.
concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This is the one place the desktop app is built. The Desktop Shell workflow
# used to compile the same three targets again, without a Rust cache, just to
# run the Windows installer smoke at the end; that smoke runs here now, on the
# installer this job has already produced.

jobs:
  # A Linux binary runs on the glibc it was linked against and on newer ones,
  # never on older. Built on ubuntu-latest, v0.21.1's engine needed glibc 2.38
  # and did not start on Debian 12 or Ubuntu 22.04, two of the releases its
  # download table named. The packages are built on the oldest release they
  # support. That is a container rather than the ubuntu-22.04 runner image,
  # which GitHub is retiring.
  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      # Python comes from deadsnakes rather than setup-python, whose builds do
      # not run inside a job container. These are built for 22.04 too.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            ca-certificates curl git xz-utils file build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev \
            libssl-dev patchelf dbus rpm software-properties-common gpg-agent
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            python3.11 python3.11-dev python3.11-venv

      - uses: actions/checkout@v4

      # build-sidecar.sh freezes the engine with venv/bin/python3 when it exists.
      - name: Create the Python environment
        run: |
          python3.11 -m venv venv
          echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build sidecar and FFmpeg
        env:
          BUNDLE_FFMPEG: "1"
        run: ./desktop-shell/scripts/build-sidecar.sh

      - name: Exercise bundled media tools and engine
        shell: bash
        env:
          PYTHONPATH: .
          SOUNDSIBLE_REQUIRE_FFMPEG: "1"
          SOUNDSIBLE_ENGINE_BIN: desktop-shell/src-tauri/binaries/soundsible-engine-x86_64-unknown-linux-gnu
        run: pytest tests/test_desktop_engine_smoke.py::test_desktop_engine_smoke_sidecar -q

      - name: Build Tauri bundles
        working-directory: desktop-shell
        env:
          SOUNDSIBLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      # From the .deb's files, with rpmbuild. Tauri's own RPM bundler took 45
      # minutes over the frozen engine here.
      - name: Build the .rpm
        run: |
          python scripts/linux_packages.py rpm \
            --deb desktop-shell/src-tauri/target/release/bundle/deb/Soundsible_*_amd64.deb \
            --out desktop-shell/src-tauri/target/release/bundle/rpm

      - name: Rust desktop and isolated D-Bus tests
        working-directory: desktop-shell/src-tauri
        run: dbus-run-session -- cargo test --locked -- --include-ignored

      - name: Show what the packages declare
        shell: bash
        run: |
          bundle=desktop-shell/src-tauri/target/release/bundle
          dpkg-deb --info "$bundle"/deb/*.deb
          rpm -qp --info --requires "$bundle"/rpm/*.rpm

      # Every smoke below drives the app through tauri-driver. Built once here,
      # on the oldest glibc, it runs on all of them.
      - name: Build tauri-driver
        run: cargo install tauri-driver --locked --root "$RUNNER_TEMP/tauri-driver"

      - name: Upload tauri-driver
        uses: actions/upload-artifact@v4
        with:
          name: ci-tauri-driver
          path: ${{ runner.temp }}/tauri-driver/bin/tauri-driver
          if-no-files-found: error
          retention-days: 1

      # actions/upload-artifact@v4 rejects '/' in artifact names. On
      # pull_request events github.ref_name is "<PR>/merge" (e.g. "22/merge"),
      # so sanitise the ref into a slash-free suffix.
      - name: Compute artifact name
        id: name
        shell: bash
        run: echo "artifact=soundsible-desktop-linux-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            desktop-shell/src-tauri/target/release/bundle/deb/*.deb
            desktop-shell/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # The newest Ubuntu, on the runner itself, with the isolation a desktop has.
  smoke-linux-ubuntu:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-linux.outputs.artifact }}
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: ci-tauri-driver
          path: ${{ runner.temp }}/tauri-driver

      - name: Install the package next to the distribution's FFmpeg
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
          sudo apt-get -o Acquire::Retries=3 install -y "$(realpath packages/deb/*.deb)" \
            webkit2gtk-driver xvfb xauth dbus-x11 pulseaudio pulseaudio-utils scrot
          chmod +x "$RUNNER_TEMP/tauri-driver/tauri-driver"

      - name: Exercise installed Linux desktop against an independent station
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          package=$(dpkg-deb -f packages/deb/*.deb Package)
          app=$(dpkg -L "$package" | grep -E '/bin/soundsible-desktop$')
          engine=$(dpkg -L "$package" | grep -E '/bin/soundsible-engine$')
          PATH="$RUNNER_TEMP/tauri-driver:$PATH" \
            desktop-shell/scripts/run-linux-ui-smoke.sh "$RUNNER_TEMP/linux-ui" --app "$app" --engine "$engine"

      - name: Upload Linux UI evidence
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-evidence-ubuntu
          path: ${{ runner.temp }}/linux-ui
          if-no-files-found: ignore
          retention-days: 14

  # The oldest release the .deb claims, and the two other package formats on
  # the distributions they are for: installed by the package manager, next to
  # the distribution's own FFmpeg, and driven exactly as on Ubuntu.
  smoke-linux-distros:
    name: smoke-linux-${{ matrix.distro }}
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:12
          - distro: fedora
            image: fedora:44
          - distro: arch
            image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-linux.outputs.artifact }}
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: ci-tauri-driver
          path: /opt/tauri-driver

      - name: Install the package
        shell: bash
        run: |
          case "${{ matrix.distro }}" in
            debian) dir=packages/deb ;;
            fedora) dir=packages/rpm ;;
            arch) dir=packages/deb ;;
          esac
          desktop-shell/scripts/install-linux-package.sh "${{ matrix.distro }}" "$dir"
          chmod 755 /opt/tauri-driver/tauri-driver

      # As a normal user, as on a desktop: PulseAudio refuses to run as root.
      # Unprivileged containers cannot create the user namespaces WebKit's
      # own process sandbox is made of, so that sandbox is off here; the
      # Ubuntu smoke runs with it.
      - name: Exercise installed Linux desktop against an independent station
        shell: bash
        run: |
          useradd -m tester
          install -d -o tester /tmp/linux-ui
          runuser -u tester -- env \
            PATH="/opt/tauri-driver:$PATH" \
            WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 \
            desktop-shell/scripts/run-linux-ui-smoke.sh /tmp/linux-ui \
              --app /usr/bin/soundsible-desktop --engine /usr/bin/soundsible-engine

      - name: Upload Linux UI evidence
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-evidence-${{ matrix.distro }}
          path: /tmp/linux-ui
          if-no-files-found: ignore
          retention-days: 14

  # The Flatpak repackages the .deb above rather than building the app a
  # second time, so it ships the binaries these smokes drove.
  build-flatpak:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-linux.outputs.artifact }}
          path: packages

      - name: Prepare the Flatpak build directory
        run: python3 scripts/linux_packages.py flatpak --deb packages/deb/Soundsible_*_amd64.deb --out flatpak-build

      - name: Validate the metainfo
        run: flatpak-builder-lint appstream flatpak-build/io.github.Arzuparreta.Soundsible.metainfo.xml

      - name: Build the Flatpak
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build \
            flatpak-build/io.github.Arzuparreta.Soundsible.yml
          version=$(python3 scripts/version_sync.py --print)
          mkdir -p bundle
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "bundle/Soundsible_${version}_x86_64.flatpak" io.github.Arzuparreta.Soundsible

      - name: Compute artifact name
        id: name
        shell: bash
        run: echo "artifact=soundsible-desktop-flatpak-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: bundle/*.flatpak
          if-no-files-found: error

  smoke-flatpak:
    needs: [build-linux, build-flatpak]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-flatpak.outputs.artifact }}
          path: flatpak

      - uses: actions/download-artifact@v4
        with:
          name: ci-tauri-driver
          path: ${{ runner.temp }}/tauri-driver

      # Ubuntu only lets AppArmor-profiled programs create user namespaces,
      # and Flatpak's sandbox is made of them.
      - name: Install Flatpak and the bundle
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y flatpak xvfb xauth dbus-x11 pulseaudio pulseaudio-utils scrot
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive --bundle flatpak/*.flatpak
          chmod +x "$RUNNER_TEMP/tauri-driver/tauri-driver"

      # WebKit's sandbox inside Flatpak's is a sub-sandbox the runner's
      # session has no portal for; Flatpak's own sandbox is what this checks.
      - name: Exercise the installed Flatpak against an independent station
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          PATH="$RUNNER_TEMP/tauri-driver:$PATH" \
            desktop-shell/scripts/run-linux-ui-smoke.sh "$RUNNER_TEMP/linux-ui" \
              --flatpak io.github.Arzuparreta.Soundsible \
              --app /app/bin/soundsible-desktop --engine soundsible-engine

      - name: Upload Flatpak UI evidence
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-ui-evidence-flatpak
          path: ${{ runner.temp }}/linux-ui
          if-no-files-found: ignore
          retention-days: 14

  build-windows:
    name: build-windows-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-shell/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # `cryptography` publishes no Windows ARM64 wheel, so pip builds it here
      # and needs a static OpenSSL. pyca, who maintain it, build one weekly as
      # a workflow artifact in pyca/infra; there is no release or CDN to fetch.
      #
      # Finding that artifact by listing workflow runs failed twice on 1 Oct
      # 2026 ("no matching workflow run found") while a dozen valid artifacts
      # existed: filtered run listings come back out of order and incomplete.
      # The artifacts listing is newest-first and complete, so pick from it,
      # check the run is pyca's own build on main, and keep the result in our
      # cache. A failed lookup then falls back to the last OpenSSL we had.
      - name: Find pyca's OpenSSL build (Windows ARM64)
        id: openssl_build
        if: matrix.arch == 'arm64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $api = "https://api.github.com/repos/pyca/infra/actions"
          try {
            $listing = Invoke-RestMethod -Headers $headers -MaximumRetryCount 3 -RetryIntervalSec 5 `
              "$api/artifacts?name=openssl-arm64&per_page=30"
          } catch {
            Write-Output "::warning::Could not list pyca/infra artifacts: $_. Falling back to the cached OpenSSL."
            exit 0
          }
          foreach ($artifact in $listing.artifacts) {
            if ($artifact.expired -or $artifact.workflow_run.head_branch -ne "main") { continue }
            $run = Invoke-RestMethod -Headers $headers -MaximumRetryCount 3 -RetryIntervalSec 5 `
              "$api/runs/$($artifact.workflow_run.id)"
            if ($run.path -ne ".github/workflows/build-windows-openssl.yml" -or $run.conclusion -ne "success") { continue }
            Write-Output "Using pyca/infra artifact $($artifact.id) from run $($run.id) ($($artifact.created_at))"
            "id=$($artifact.id)" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Output "::warning::No current OpenSSL build in pyca/infra. Falling back to the cached OpenSSL."

      - name: Restore OpenSSL (Windows ARM64)
        id: openssl_cache
        if: matrix.arch == 'arm64'
        uses: actions/cache/restore@v4
        with:
          path: C:/openssl-arm64
          key: openssl-arm64-${{ steps.openssl_build.outputs.id || 'unavailable' }}
          restore-keys: openssl-arm64-

      - name: Download OpenSSL (Windows ARM64)
        if: matrix.arch == 'arm64' && steps.openssl_build.outputs.id && steps.openssl_cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "openssl-arm64.zip"
          Invoke-WebRequest -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile $zip `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } `
            "https://api.github.com/repos/pyca/infra/actions/artifacts/${{ steps.openssl_build.outputs.id }}/zip"
          if (Test-Path C:/openssl-arm64) { Remove-Item -Recurse -Force C:/openssl-arm64 }
          Expand-Archive -Path $zip -DestinationPath C:/openssl-arm64

      - name: Save OpenSSL (Windows ARM64)
        if: matrix.arch == 'arm64' && steps.openssl_build.outputs.id && steps.openssl_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/openssl-arm64
          key: openssl-arm64-${{ steps.openssl_build.outputs.id }}

      - name: Check OpenSSL (Windows ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Test-Path C:/openssl-arm64/include/openssl/ssl.h) -or -not (Get-ChildItem C:/openssl-arm64/lib -Filter *.lib -ErrorAction SilentlyContinue)) {
            throw "No OpenSSL for the ARM64 cryptography build: pyca/infra had none to download and the cache was empty."
          }

      - name: Configure OpenSSL for Python cryptography (Windows ARM64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          echo "OPENSSL_DIR=C:/openssl-arm64" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-shell/src-tauri

      # pywinauto drives the installed app in the UI smoke below.
      - name: Install Python dependencies
        run: pip install -r requirements.txt pywinauto==0.6.9

      - name: Validate ARM64 cryptography runtime
        if: matrix.arch == 'arm64'
        run: python -c "from cryptography.hazmat.bindings._rust import openssl"

      - name: Build sidecar and FFmpeg
        shell: bash
        env:
          BUNDLE_FFMPEG: "1"
        run: ./desktop-shell/scripts/build-sidecar.sh

      - name: Exercise bundled media tools and engine
        shell: bash
        env:
          PYTHONPATH: .
          SOUNDSIBLE_REQUIRE_FFMPEG: "1"
          SOUNDSIBLE_ENGINE_BIN: desktop-shell/src-tauri/binaries/soundsible-engine-${{ matrix.target }}.exe
        run: pytest tests/test_desktop_engine_smoke.py::test_desktop_engine_smoke_sidecar -q

      - name: Build Tauri bundles
        working-directory: desktop-shell
        env:
          SOUNDSIBLE_REPO_ROOT: ${{ github.workspace }}
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify native binary architectures
        shell: pwsh
        run: |
          ./desktop-shell/scripts/verify-pe-architecture.ps1 `
            -Architecture "${{ matrix.arch }}" `
            "desktop-shell/src-tauri/binaries/soundsible-engine-${{ matrix.target }}.exe" `
            "desktop-shell/src-tauri/binaries/ffprobe-${{ matrix.target }}.exe" `
            "desktop-shell/src-tauri/binaries/ffmpeg-${{ matrix.target }}.exe" `
            "desktop-shell/src-tauri/target/release/soundsible-desktop.exe"

      # Installs the installer this job just built, drives the app's own window,
      # and uninstalls it. Not on release tags, which never ran it: the UI smoke
      # is the flakiest thing in desktop CI (UIA timeouts on a cold runner) and
      # must not be what stops a release.
      #
      # On ARM64 it only warns. The hosted windows-11-arm runner shows a privacy
      # dialog on every fresh image, sometimes swallows the global quit, and then
      # misses the relaunch deadline; x64 runs the same smoke on the same code and
      # still fails the job when the app is really broken.
      - name: Install, exercise native UI, and uninstall
        id: ui_smoke
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            "desktop-shell/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          ./desktop-shell/scripts/windows-installer-smoke.ps1 `
            -Installer $installer.FullName `
            -ArtifactDirectory "desktop-shell/windows-smoke-artifacts/${{ matrix.arch }}" `
            -UiSmoke

      - name: Report an ARM64 UI smoke failure
        if: ${{ steps.ui_smoke.outcome == 'failure' && matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          Write-Output "::warning title=ARM64 UI smoke failed::The native UI smoke failed on the ARM64 runner. It is advisory there; the x64 job runs the same smoke and gates. Diagnostics are in the soundsible-windows-smoke-arm64 artifact."

      - name: Upload Windows diagnostics
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: soundsible-windows-smoke-${{ matrix.arch }}
          path: desktop-shell/windows-smoke-artifacts/${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 14

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $bundle = "desktop-shell/src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$bundle/*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ASCII "$bundle/SHA256SUMS-${{ matrix.arch }}.txt"

      - name: Attest Windows installer
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: desktop-shell/src-tauri/target/release/bundle/nsis/*.exe

      - name: Compute artifact name
        shell: bash
        run: echo "ARTIFACT_NAME=soundsible-desktop-windows-${{ matrix.arch }}-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            desktop-shell/src-tauri/target/release/bundle/nsis/*.exe
            desktop-shell/src-tauri/target/release/bundle/nsis/SHA256SUMS-*.txt
          if-no-files-found: error

