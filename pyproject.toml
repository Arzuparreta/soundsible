[tool.ruff]
line-length = 120
exclude = [
    ".venv",
    "node_modules",
    "target",
    "dist",
    "build",
    ".pytest_cache",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F"]
# E402  = import not at top (deliberate: blueprints defer imports to break the
#         circular dependency with shared/api/__init__.py)
# E501  = line too long (legacy code has many long lines)
# E701  = multiple statements on one line (legacy style)
# F541  = f-string without placeholders (cosmetic)
# F811  = redefinition of unused (common in local function imports)
#
# F401/F841 are enforced: they are the only real dead-code detection this
# codebase has. Intentional re-exports carry an explicit `# noqa: F401`.
ignore = ["E402", "E501", "E701", "F541", "F811"]

[tool.ruff.lint.per-file-ignores]
# Note: Tests often do mid-file imports and may have unused imports for clarity.
"tests/*" = ["E402", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.mccabe]
max-complexity = 25
