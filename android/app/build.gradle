        versionCode = 1
        versionName = "0.19.1"

        ndk {
            // The embedded Python interpreter is native code: one copy per
            // ABI. Release ships arm64-v8a only (real phones); add x86_64
            // locally when testing on an emulator.
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // Local throwaway debug key. Generated by scripts/build_android_apk.sh
        // into android/keystores/debug.keystore (gitignored, never shipped as
        // a release identity). Lets a developer sign a locally installable APK
        // without owning a Play upload key.
        getByName("debug") {
            storeFile = file("../keystores/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        create("localRelease") {
            storeFile = file("../keystores/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        getByName("debug") {
            signingConfig = signingConfigs.getByName("debug")
        }
        getByName("release") {
            // Signed with the same local debug key so the APK is installable
            // and verifiable with apksigner. This is NOT a Play release
            // identity; see docs/ANDROID.md.
            signingConfig = signingConfigs.getByName("localRelease")
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
