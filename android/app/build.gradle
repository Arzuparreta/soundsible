android {
    namespace = "com.soundsible.player"
    compileSdk = 34

    defaultConfig {
        applicationId = "com.soundsible.player"
        minSdk = 26
        targetSdk = 34
        // Kept in step with shared/version.py by scripts/version_sync.py.
        // versionCode is a build counter, not the product version: bump it
        // whenever the installable artifact changes meaningfully so builds
        // are distinguishable on device.
        versionCode = 18
        versionName = "0.19.1"

        ndk {
            // The embedded Python interpreter is native code: one copy per
            // ABI. Release ships arm64-v8a only (real phones); add x86_64
            // locally when testing on an emulator.
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        // Local throwaway debug key. Generated by scripts/build_android_apk.sh
        // into android/keystores/debug.keystore (gitignored, never shipped as
        // a release identity). Lets a developer sign a locally installable APK
        // without owning a Play upload key.
        getByName("debug") {
            storeFile = file("../keystores/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
        create("localRelease") {
            storeFile = file("../keystores/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        getByName("debug") {
            signingConfig = signingConfigs.getByName("debug")
        }
        getByName("release") {
            // Signed with the same local debug key so the APK is installable
            // and verifiable with apksigner. This is NOT a Play release
            // identity; see docs/ANDROID.md.
            signingConfig = signingConfigs.getByName("localRelease")
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            // Staged web player bundle (ui_web/dist) produced by
            // :app:syncWebUi. Served by the on-device engine; kept out of
            // git like engine-src.
            assets.srcDir("web-ui-staging")
        }
    }
}

chaquopy {
    defaultConfig {
        // Must match the build machine's interpreter (see buildPython):
        // Chaquopy embeds this exact major.minor on device.
        version = "3.13"
        buildPython "python3.13"
        pip {
            // Mirrors requirements.txt minus the gevent stack (no native
            // core on Android; the server falls back to threading, see
            // _socket_async_mode) and minus curl-cffi (optional in yt-dlp).
            install("flask>=2.3.0")
            install("flask-socketio>=5.3.0")
            install("flask-cors>=4.0.0")
            install("requests>=2.31.0")
            install("platformdirs>=4.2.0")
            install("mutagen>=1.46.0")
            install("feedparser>=6.0.10")
            install("python-dotenv>=1.0.0")
            install("boto3>=1.28.0")
            install("b2sdk>=1.19.0")
            install("rich>=13.5.0")
            install("numpy>=1.26.0")
            install("pillow>=10.0.0")
            install("cryptography>=41.0.0")
            install("yt-dlp==2026.8.19")
            // yt-dlp optional runtime: AES-gated extractors (pycryptodome),
            // compressed responses (brotli) and websocket transports.
            // Dropped individually if Chaquopy ships no build for them.
            install("pycryptodomex")
            install("brotli")
            install("websockets>=12.0")
        }
    }
    sourceSets {
        main {
            // Staged copy of the engine (shared/, player/, setup_tool/)
            // produced by :app:syncEngineSources. Kept out of git; the
            // APK always bundles the working tree it was built from.
            srcDir("engine-src")
        }
    }
}

// Stage the engine's Python packages next to src/main/python so Chaquopy
// bundles `shared.*`, `player.*` and `setup_tool.*` with their repo layout.
tasks.register("syncEngineSources", Copy) {
    def repoRoot = projectDir.parentFile.parentFile
    from(repoRoot) {
        include("shared/**", "player/**", "setup_tool/**")
        exclude("**/__pycache__/**", "**/*.pyc")
    }
    into(layout.projectDirectory.dir("engine-src"))
}

// Stage the built web player (ui_web/dist) as APK assets for the on-device
// engine. The bundle is produced by the engine's own ensure_ui_dist sync,
// never by this build: fail loudly when it is missing instead of shipping
// an engine with no management UI.
tasks.register("syncWebUi", Copy) {
    def dist = projectDir.parentFile.parentFile.toPath()
        .resolve("ui_web/dist").toFile()
    doFirst {
        if (!new File(dist, "index.html").isFile()) {
            throw new GradleException(
                "ui_web/dist/index.html is missing. Build it through the " +
                "engine sync (python3 -c \"from shared.ensure_ui_dist " +
                "import ensure_ui_dist; ensure_ui_dist()\") " +
                "after `cd ui_web && npm ci`, then rebuild the APK.")
        }
    }
    from(dist) {
        // Vite emits .gz twins for static hosting; the engine serves the
        // plain files on loopback, and AAPT rejects the twins as duplicates.
        exclude("**/*.gz")
    }
    into(layout.projectDirectory.dir("web-ui-staging/ui-dist"))
}
tasks.matching {
    it.name.contains("Python")
}.configureEach {
    dependsOn("syncEngineSources")
}
tasks.matching {
    it.name.contains("Assets") || it.name.startsWith("merge") || it.name.startsWith("lint")
}.configureEach {
    dependsOn("syncWebUi")
}

