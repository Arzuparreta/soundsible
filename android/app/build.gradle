import groovy.json.JsonSlurper
import groovy.json.JsonOutput

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def metadataFile = rootProject.file('build-info.json')
if (!metadataFile.exists()) throw new GradleException('Run python scripts/android.py prepare first')
def metadata = new JsonSlurper().parse(metadataFile)

android {
    testBuildType = System.getenv('SOUNDSIBLE_ANDROID_TEST_RELEASE') == '1' ? 'release' : 'debug'
    signingConfigs {
        distribution {
            def keyPath = System.getenv('ANDROID_KEYSTORE')
            def passwordPath = System.getenv('ANDROID_KEYSTORE_PASSWORD_FILE')
            if (keyPath && passwordPath) {
                storeFile file(keyPath)
                storePassword file(passwordPath).text.trim()
                keyAlias 'soundsible-android'
                keyPassword storePassword
            }
        }
    }
    sourceSets { test.resources.srcDir('../../shared/contracts') }
    namespace = "com.soundsible.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.soundsible.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode metadata.version_code as int
        versionName metadata.version
        buildConfigField "String", "SOURCE_REVISION", JsonOutput.toJson(metadata.source_revision)
        testInstrumentationRunnerArguments expectedVersion: metadata.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = "21" }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Soundsible Dev"
            resValue "string", "title_activity_main", "Soundsible Dev"
        }
        release {
            signingConfig signingConfigs.distribution
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'packageRelease' } &&
        (!System.getenv('ANDROID_KEYSTORE') || !System.getenv('ANDROID_KEYSTORE_PASSWORD_FILE'))) {
        throw new GradleException('Release signing requires ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD_FILE')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation(name: "soundsible-webrtc", ext: "aar")
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-session:1.11.1"
    implementation "androidx.media3:media3-datasource-okhttp:1.11.1"
    implementation("io.socket:socket.io-client:2.1.2") { exclude group: "org.json", module: "json" }
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Pairing QR: camera preview/analysis and a pure-Java decoder; no Google Play services required.
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    implementation "androidx.camera:camera-view:1.4.2"
    implementation "com.google.zxing:core:3.5.3"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // The real org.json, instead of android.jar stubs, for JVM tests of payload parsing.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
