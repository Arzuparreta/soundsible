server {
    listen 80;
    listen [::]:80;
    server_name live.84-247-161-82.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.84-247-161-82.sslip.io;

    ssl_certificate /etc/letsencrypt/live/live.84-247-161-82.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.84-247-161-82.sslip.io/privkey.pem;

    location /media/ {
        proxy_pass http://127.0.0.1:18889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:18080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
