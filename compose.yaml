name: soundsible

# This file pulls a published image. Nothing here builds, so `docker compose
# up -d` works on a NAS or a Pi that could never compile the Node bundle and
# the Python wheels itself.
#
# To build from your working tree instead, add the override:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build

services:
  soundsible:
    image: ghcr.io/arzuparreta/soundsible:${SOUNDSIBLE_TAG:-edge}
    restart: unless-stopped
    init: true
    ports:
      - "${SOUNDSIBLE_PORT:-5005}:5005"
    environment:
      SOUNDSIBLE_ADMIN_TOKEN: ${SOUNDSIBLE_ADMIN_TOKEN:-}
      SOUNDSIBLE_YT_SEARCH_SOURCE: ${SOUNDSIBLE_YT_SEARCH_SOURCE:-ytmusic}
      SOUNDSIBLE_PREVIEW_CACHE_MB: ${SOUNDSIBLE_PREVIEW_CACHE_MB:-2048}
      SOUNDSIBLE_COMMUNITY_DISABLED: ${SOUNDSIBLE_COMMUNITY_DISABLED:-false}
    volumes:
      - soundsible-config:/config
      - soundsible-data:/data
      - soundsible-cache:/cache
      - soundsible-logs:/logs
      - soundsible-music:/music
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:5005/api/health', timeout=4); assert response.status == 200 and json.load(response).get('status') == 'healthy'"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

volumes:
  soundsible-config:
  soundsible-data:
  soundsible-cache:
  soundsible-logs:
  soundsible-music:
