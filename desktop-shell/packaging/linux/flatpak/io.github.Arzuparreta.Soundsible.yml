# Flatpak of the Linux desktop app, repackaged from the .deb that CI builds,
# installs and drives — the same binaries, not a second build of them.
#
# Not used directly: scripts/linux_packages.py flatpak copies this next to the
# .deb, the versioned metainfo and Flathub's shared modules, then
# flatpak-builder runs on that directory. See docs/LINUX_PACKAGES.md.
id: io.github.Arzuparreta.Soundsible
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: soundsible-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # NVIDIA can reject WebKit's GBM buffers (a blank player). Keep accelerated
  # rendering, but transfer frames through shared memory instead of DMA-BUF.
  # WEBKIT_DISABLE_DMABUF_RENDERER also disables acceleration; do not use it.
  - --env=WEBKIT_DMABUF_RENDERER_FORCE_SHM=1
  # The engine listens on 127.0.0.1, the app can join a station elsewhere on
  # the network, and search and downloads reach the internet.
  - --share=network
  - --socket=pulseaudio
  # The default library and download folders. Music kept elsewhere needs
  # `flatpak override --filesystem=<path>`; see the packaging docs.
  - --filesystem=xdg-music
  - --filesystem=xdg-download
  # Media keys and the desktop's media widget.
  - --own-name=org.mpris.MediaPlayer2.soundsible
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  # Tauri loads the tray library at runtime; the GNOME runtime has none.
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: soundsible
    buildsystem: simple
    build-options:
      # The engine is a PyInstaller executable whose Python archive is
      # appended to the ELF file. Stripping cuts the archive off.
      strip: false
      no-debuginfo: true
    sources:
      - type: file
        path: soundsible.deb
      - type: file
        path: io.github.Arzuparreta.Soundsible.metainfo.xml
    build-commands:
      - ar x soundsible.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/soundsible-desktop /app/bin/soundsible-desktop
      - install -Dm755 usr/bin/soundsible-engine /app/bin/soundsible-engine
      - install -Dm644 usr/share/applications/Soundsible.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/soundsible-desktop.png /app/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/soundsible-desktop.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/soundsible-desktop.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
